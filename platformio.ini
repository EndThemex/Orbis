; Orbis —— Waveshare ESP32-S3-Touch-AMOLED-1.75 (466x466 CO5300 QSPI 圆屏)
; 构建：pio run          烧录：pio run -t upload     串口：pio device monitor
;
; 工具链说明：
;   espressif32@6.8.0 + Arduino core 2.0.17：本机已有完整缓存，编译快、无需联网。
;   Arduino_GFX 必须锁 1.6.0 —— 1.6.1 起开始 include esp32-hal-periman.h，只有 Arduino core 3.x 才有。
;   想升级到 Arduino core 3.3.x（微雪官方验证 3.3.10）时，把 platform 换成 pioarduino 分支：
;     platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
;   同时把 lib_deps 改回 ^1.6.9，并注意 core 3.x 的 API 差异。

[env:orbis]
platform = espressif32@6.8.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- Flash / PSRAM（板载 16MB QIO Flash + 8MB OPI PSRAM）----
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; ---- 串口 ----
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
    lewisxhe/SensorLib @ ^0.5.2
